<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ejercicio 2 justify content</title>
    <style>
        #container{
            width: 600px;
            border: 1px solid black;
            margin: 0 auto;
        }
        #container > div{
            display: flex;
            border: 1px black solid;
        }

        #container div div{
            width: 50px;
            height: 50px;
            background: red;
            margin-right: 5px;
            border: 1px solid black;
        }
        #flex-start{
            justify-content: flex-start ;
        }
        #flex-end{
            justify-content: flex-end;
        }
        #center{
            justify-content: center;
        }
        #space-between{
            justify-content: space-between;
        }
        #space-around{
            justify-content: space-around;
        }

    </style>


</head>
<body>
<div id="container">
    <p>Justify-content: flex-start</p>
    <div id="flex-start">  <!-- Padre de los div de abajo -->
        <div></div>
        <div></div>
        <div></div>
    </div>
    <p>Justify-content: flex-end</p>
    <div id="flex-end">
        <div></div>
        <div></div>
        <div></div>
    </div>
    <p>Justify-content: center</p>
    <div id="center">
        <div></div>
        <div></div>
        <div></div>
    </div>
    <p>Justify-content: space-between</p>
    <div id="space-between">
        <div></div>
        <div></div>
        <div></div>
    </div>
    <p>Justify-content: space-around</p>
    <div id="space-around">
        <div></div>
        <div></div>
        <div></div>
    </div>
</div>

</body>
</html>
